<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>StockTech - Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="css/style.css">

</head>


<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
            href="index.html">

            📦 StockTech

        </a>


        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a class="nav-link"
                        href="index.html">

                        Dashboard

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link"
                        href="produtos.html">

                        Produtos

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active"
                        href="cadastro.html">

                        Cadastrar Produto

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 id="tituloFormulario">
                        Cadastrar Produto
                    </h2>

                    <p class="text-muted">
                        Preencha as informações do produto.
                    </p>


                    <form id="formProduto">


                        <div class="mb-3">

                            <label class="form-label">
                                Nome do Produto
                            </label>

                            <input
                                type="text"
                                id="nome"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Categoria
                            </label>

                            <select
                                id="categoria"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Selecione
                                </option>

                                <option value="Eletrônicos">
                                    Eletrônicos
                                </option>

                                <option value="Informática">
                                    Informática
                                </option>

                                <option value="Escritório">
                                    Escritório
                                </option>

                                <option value="Outros">
                                    Outros
                                </option>

                            </select>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Quantidade
                                </label>

                                <input
                                    type="number"
                                    id="quantidade"
                                    class="form-control"
                                    min="0"
                                    required
                                >

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Preço
                                </label>

                                <input
                                    type="number"
                                    id="preco"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    required
                                >

                            </div>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Salvar Produto

                            </button>


                            <a
                                href="produtos.html"
                                class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
