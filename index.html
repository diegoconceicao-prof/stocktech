<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockTech - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            📦 StockTech
        </a>

        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="produtos.html">
                        Produtos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cadastro.html">
                        Cadastrar Produto
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>


<main class="container py-5">

    <div class="mb-4">
        <h1>Dashboard</h1>
        <p class="text-muted">
            Visão geral do seu estoque.
        </p>
    </div>


    <div class="row g-4">

        <div class="col-md-3">
            <div class="card card-dashboard shadow-sm">
                <div class="card-body">

                    <h6>Total de Produtos</h6>

                    <h2 id="totalProdutos">
                        0
                    </h2>

                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card card-dashboard shadow-sm">
                <div class="card-body">

                    <h6>Quantidade em Estoque</h6>

                    <h2 id="quantidadeEstoque">
                        0
                    </h2>

                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card card-dashboard shadow-sm">
                <div class="card-body">

                    <h6>Estoque Baixo</h6>

                    <h2 id="estoqueBaixo">
                        0
                    </h2>

                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card card-dashboard shadow-sm">
                <div class="card-body">

                    <h6>Valor Total</h6>

                    <h2 id="valorTotal">
                        R$ 0,00
                    </h2>

                </div>
            </div>
        </div>

    </div>


    <div class="card shadow-sm mt-5">

        <div class="card-header">
            <h5 class="mb-0">
                Produtos com Estoque Baixo
            </h5>
        </div>

        <div class="card-body">

            <div id="listaEstoqueBaixo">

                <p class="text-muted">
                    Nenhum produto com estoque baixo.
                </p>

            </div>

        </div>

    </div>

</main>


<script src="js/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
