<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockTech - Produtos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            📦 StockTech
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="index.html">
                Dashboard
            </a>

            <a class="nav-link active" href="produtos.html">
                Produtos
            </a>

            <a class="nav-link" href="cadastro.html">
                Cadastrar Produto
            </a>

        </div>

    </div>

</nav>


<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>📦 Produtos</h1>

            <p class="text-muted">
                Gerencie todos os produtos cadastrados.
            </p>
        </div>

        <a href="cadastro.html" class="btn btn-primary">
            + Novo Produto
        </a>

    </div>


    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-6">

                    <input
                        type="text"
                        id="campoBusca"
                        class="form-control"
                        placeholder="🔎 Pesquisar produto..."
                    >

                </div>


                <div class="col-md-6">

                    <select
                        id="filtroCategoria"
                        class="form-select"
                    >

                        <option value="">
                            Todas as categorias
                        </option>

                        <option value="Eletrônicos">
                            Eletrônicos
                        </option>

                        <option value="Informática">
                            Informática
                        </option>

                        <option value="Escritório">
                            Escritório
                        </option>

                        <option value="Outros">
                            Outros
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>

                    </thead>


                    <tbody id="listaProdutos">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


<script src="js/script.js"></script>

</body>
</html>
